<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - Ben Workspace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="login-page">
    <main class="login-shell carte">
      <div class="marque login-brand">
        <div class="point-marque"></div>
        <div>
          <h1 class="titre-marque">Ben Workspace</h1>
          <p class="sous-titre-marque">Accès protégé</p>
        </div>
      </div>

      {% if not authentication_configured %}
        <div class="login-error" role="alert">
          L’authentification serveur n’est pas configurée correctement. Les deux mots de passe doivent être présents et distincts.
        </div>
      {% endif %}
      {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}

      <form method="post" action="{{ url_for('login') }}" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label>
          Mot de passe
          <input name="password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button class="btn-primaire" type="submit" {% if not authentication_configured %}disabled{% endif %}>
          Se connecter
        </button>
      </form>
    </main>
  </body>
</html>
